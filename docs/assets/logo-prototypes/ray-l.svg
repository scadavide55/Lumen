    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171a22"/><stop offset="1" stop-color="#05060a"/></linearGradient>
    <linearGradient id="stem" gradientUnits="userSpaceOnUse" x1="0" y1="245" x2="0" y2="780"><stop offset="0" stop-color="#7df9ff" stop-opacity="0.3"/><stop offset="0.75" stop-color="#d9fdff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7df9ff" stop-opacity="0.4"/><stop offset="1" stop-color="#7df9ff" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="36"/></filter>
