<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Tacet — Half moon, stop: Half disc, night with the glowing stop from t. gold sitting on the line between light and dark. -->
  <defs>
    <clipPath id="body"><path d="M284 100 H740 A184 184 0 0 1 924 284 V740 A184 184 0 0 1 740 924 H284 A184 184 0 0 1 100 740 V284 A184 184 0 0 1 284 100 Z"/></clipPath>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#221d36"/><stop offset="1" stop-color="#0b0a12"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3d6"/><stop offset="1" stop-color="#d9a85c"/></linearGradient><radialGradient id="lit" cx=".7" cy=".35" r=".8"><stop offset="0" stop-color="#fff8ea"/><stop offset="1" stop-color="#e2cfaa"/></radialGradient><linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc35a"/><stop offset="1" stop-color="#f2551f"/></linearGradient><filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <g clip-path="url(#body)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="512" cy="512" r="300" fill="#16131f"/>
    <path d="M512 212 A300 300 0 0 1 512 812 Z" fill="url(#lit)"/>
    <circle cx="512" cy="512" r="300" fill="none" stroke="url(#gold)" stroke-width="22"/>
    <circle cx="512" cy="512" r="88" fill="#ff8a3d" filter="url(#bloom)" opacity=".6"/><circle cx="512" cy="512" r="44" fill="url(#sun)"/>
  </g>
  <path d="M284 100 H740 A184 184 0 0 1 924 284 V740 A184 184 0 0 1 740 924 H284 A184 184 0 0 1 100 740 V284 A184 184 0 0 1 284 100 Z" fill="url(#sheen)"/>
  <path d="M284 100 H740 A184 184 0 0 1 924 284 V740 A184 184 0 0 1 740 924 H284 A184 184 0 0 1 100 740 V284 A184 184 0 0 1 284 100 Z" fill="none" stroke="#000" stroke-opacity=".1" stroke-width="4"/>
</svg>
